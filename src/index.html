    <!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Sistema de Cadastro</title><link rel="stylesheet" href="style.css"></head><body><div class="container"><header><h1>Sistema de Clientes</h1></header><main><div class="tabs"><button class="tab-btn active" onclick="mostrarAba('login')">Login</button><button class="tab-btn" onclick="mostrarAba('cadastro')">Cadastro</button><button class="tab-btn" onclick="mostrarAba('cadastrar-produto')" id="aba-produto" style="display:none">Cadastrar Produto</button><button class="tab-btn" onclick="mostrarAba('consultar-produto')" id="aba-consulta" style="display:none">Consultar Produtos</button><button class="tab-btn" onclick="mostrarAba('consultar-clientes')" id="aba-clientes" style="display:none">Consultar Clientes</button></div><div id="login-form" class="form-container active"><h2>Fazer Login</h2><form onsubmit="fazerLogin(event)"><div class="form-group"><label for="login-email">E-mail:</label><input type="email" id="login-email" required placeholder="seu@email.com"></div><div class="form-group"><label for="login-senha">Senha:</label><input type="password" id="login-senha" required placeholder="Digite sua senha"></div><button type="submit" class="btn-primary">Entrar</button></form><div id="login-mensagem"></div></div><div id="cadastro-form" class="form-container"><h2>Cadastrar Cliente</h2><form onsubmit="cadastrarCliente(event)"><div class="form-group"><label for="cadastro-nome">Nome:</label><input type="text" id="cadastro-nome" required placeholder="Seu nome"></div><div class="form-group"><label for="cadastro-email">E-mail:</label><input type="email" id="cadastro-email" required placeholder="seu@email.com"></div><div class="form-group"><label for="cadastro-senha">Senha:</label><input type="password" id="cadastro-senha" required placeholder="Senha" minlength="6"></div><div class="form-group"><label for="cadastro-confirmar-senha">Confirmar Senha:</label><input type="password" id="cadastro-confirmar-senha" required placeholder="Confirme"></div><button type="submit" class="btn-primary">Cadastrar</button></form><div id="cadastro-mensagem"></div></div><div id="area-usuario" class="form-container" style="display:none"><h2>Bem-vindo!</h2><div id="dados-usuario"></div><button onclick="fazerLogout()" class="btn-secondary">Sair</button></div><div id="cadastrar-produto-form" class="form-container"><h2>Cadastrar Produto</h2><form onsubmit="cadastrarProduto(event)"><div class="form-group"><label for="produto-nome">Nome:</label><input type="text" id="produto-nome" required placeholder="Nome produto"></div><div class="form-group"><label for="produto-descricao">Descrição:</label><textarea id="produto-descricao" required placeholder="Descrição" rows="3"></textarea></div><div class="form-group"><label for="produto-preco">Preço (R$):</label><input type="number" id="produto-preco" required placeholder="0.00" step="0.01" min="0"></div><div class="form-group"><label for="produto-quantidade">Quantidade:</label><input type="number" id="produto-quantidade" required placeholder="0" min="0"></div><div class="form-group"><label for="produto-categoria">Categoria:</label><select id="produto-categoria" required><option value="">Selecione</option><option value="eletronico">Eletrônico</option><option value="roupa">Roupa</option><option value="alimento">Alimento</option><option value="livro">Livro</option><option value="outro">Outro</option></select></div><button type="submit" class="btn-primary">Cadastrar Produto</button></form><div id="produto-mensagem"></div></div><div id="consultar-produto-form" class="form-container"><h2>Consultar Produtos</h2><div class="form-group"><label for="busca-produto">Buscar:</label><input type="text" id="busca-produto" placeholder="Nome produto" onkeyup="buscarProdutos()"></div><div class="form-group"><label for="filtro-categoria">Categoria:</label><select id="filtro-categoria" onchange="buscarProdutos()"><option value="">Todas</option><option value="eletronico">Eletrônico</option><option value="roupa">Roupa</option><option value="alimento">Alimento</option><option value="livro">Livro</option><option value="outro">Outro</option></select></div><button onclick="buscarProdutos()" class="btn-primary">Buscar</button><button onclick="limparBusca()" class="btn-secondary">Limpar</button><div id="lista-produtos" style="margin-top:2rem"><h3>Produtos</h3><div id="produtos-encontrados"></div></div></div><div id="consultar-clientes-form" class="form-container"><h2>Consultar Clientes</h2><div class="form-group"><label for="busca-cliente">Buscar:</label><input type="text" id="busca-cliente" placeholder="Nome ou email" onkeyup="buscarClientes()"></div><button onclick="buscarClientes()" class="btn-primary">Buscar</button><button onclick="limparBuscaClientes()" class="btn-secondary">Limpar</button><div id="lista-clientes" style="margin-top:2rem"><h3>Clientes</h3><div id="clientes-encontrados"></div></div></div></main></div><script src="script.js"></script></body></html>
